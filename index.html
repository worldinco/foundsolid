<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOUND SOLID | OFFICIAL SYSTEM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/ethereum-provider@2.10.1/dist/index.umd.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        body { background:#d1d5db; min-height:100vh; margin:0; display:flex; flex-direction:column; align-items:center; font-family: sans-serif; color:#000; }
        .header-bar { width:100%; display:flex; justify-content:flex-end; align-items:center; max-width:1200px; padding:20px; box-sizing:border-box; }
        #wallet-ui { display:none; align-items:center; background:white; padding:10px 20px; border-radius:50px; border:3px solid #000; font-weight:900; font-size:12px; box-shadow: 4px 4px 0 #000; }
        .btn-blue { padding:12px 25px; border-radius:50px; border:3px solid #000; background:#2563eb; color:white; font-weight:900; cursor:pointer; text-transform:uppercase; box-shadow:0 4px 0 #1e3a8a; font-size:11px; transition: 0.1s; }
        .logo-header { font-family:'Montserrat', sans-serif; font-weight:900; font-size:30px; text-transform:uppercase; text-align:center; color:white; margin:40px 0; text-shadow:0 4px 0 #000; }
        #dashboard { display:none; width:100%; max-width:1200px; padding:0 20px; box-sizing:border-box; }
        .card { background:white; border-radius:20px; padding:25px; border:4px solid #000; box-shadow:8px 8px 0 #000; margin-bottom:20px; }
        .val { font-size:28px; font-weight:900; display:block; margin-top:5px; }
        .lbl { font-size:11px; font-weight:900; color:#6b7280; text-transform:uppercase; }
    </style>
</head>
<body>

<div class="header-bar">
    <div id="wallet-ui">
        <span id="addr-display">0x00...0000</span>
    </div>
    <button class="btn-blue" id="connect-btn" onclick="connect()">Connect Wallet</button>
</div>

<div id="welcome-text" class="logo-header">FOUND SOLID<br>SYSTEM</div>

<div id="dashboard">
    <div class="card">
        <span class="lbl">Ваш активный вклад</span>
        <span id="user-dep" class="val">Загрузка...</span>
        <button class="btn-blue" style="width:100%; margin-top:20px;" onclick="updateBalance()">ОБНОВИТЬ БАЛАНС</button>
    </div>
</div>

<script>
    const PROJECT_ID = '39a7f9ab464230bd60ad55ac75881508'; 
    const CONTRACT_ADDR = "0xEe07336fdEC05d9f6B9e603809B34a03C3205760";
    const ABI = ["function userDeposits(address) view returns (uint256)"];

    let provider, signer, user;

    async function connect() {
        // Проверка: загрузилась ли библиотека?
        const WCProvider = window.WalletConnectEthereumProvider;
        if (!WCProvider) {
            alert("Библиотека ещё грузится, подождите пару секунд и нажмите снова.");
            return;
        }

        try {
            const ethereumProvider = await WCProvider.EthereumProvider.init({
                projectId: PROJECT_ID,
                showQrModal: true,
                qrModalOptions: { themeMode: "light" },
                chains: [56], 
                methods: ["eth_sendTransaction", "personal_sign"],
                events: ["chainChanged", "accountsChanged"]
            });

            await ethereumProvider.connect();
            
            provider = new ethers.providers.Web3Provider(ethereumProvider);
            signer = provider.getSigner();
            user = await signer.getAddress();

            document.getElementById("welcome-text").style.display = "none";
            document.getElementById("dashboard").style.display = "block";
            document.getElementById("connect-btn").style.display = "none";
            document.getElementById("wallet-ui").style.display = "flex";
            document.getElementById("addr-display").innerText = user.slice(0,6) + "..." + user.slice(-4);

            updateBalance();
        } catch (e) {
            console.error(e);
            alert("Ошибка подключения: " + e.message);
        }
    }

    async function updateBalance() {
        try {
            const contract = new ethers.Contract(CONTRACT_ADDR, ABI, provider);
            const dep = await contract.userDeposits(user);
            document.getElementById("user-dep").innerText = ethers.utils.formatUnits(dep, 18) + " USDT";
        } catch (e) {
            console.error(e);
            document.getElementById("user-dep").innerText = "Ошибка данных";
        }
    }
</script>
</body>
</html>
